<!DOCTYPE html>
<html>

<head>
    <title>Contract Test</title>
    <script src="./ethers.umd.min.js"></script>
</head>

<body>
    <h1>Contract Connection Test</h1>
    <div id="status">Testing...</div>
    <div id="data"></div>

    <script>
        const contractAddress = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
        const contractABI = [
            "function electionActive() view returns (bool)",
            "function totalCandidates() view returns (uint)",
            "function totalVotes() view returns (uint)",
            "function getAllCandidates() view returns (tuple(uint id, string name, uint voteCount)[])"
        ];

        async function test() {
            try {
                document.getElementById('status').innerText = 'Connecting to http://127.0.0.1:8545...';

                const provider = new ethers.providers.JsonRpcProvider('http://127.0.0.1:8545');
                const contract = new ethers.Contract(contractAddress, contractABI, provider);

                document.getElementById('status').innerText = 'Fetching data...';

                const active = await contract.electionActive();
                const votes = await contract.totalVotes();
                const candidates = await contract.totalCandidates();
                const list = await contract.getAllCandidates();

                document.getElementById('status').innerText = '✅ SUCCESS!';
                document.getElementById('data').innerHTML = `
                    <h2>Results:</h2>
                    <p><strong>Election Active:</strong> ${active}</p>
                    <p><strong>Total Votes:</strong> ${votes}</p>
                    <p><strong>Total Candidates:</strong> ${candidates}</p>
                    <h3>Candidates:</h3>
                    <ul>
                        ${list.map(c => `<li>#${c.id}: ${c.name} (${c.voteCount} votes)</li>`).join('')}
                    </ul>
                `;

                console.log('Contract data:', { active, votes, candidates, list });
            } catch (e) {
                document.getElementById('status').innerText = '❌ ERROR: ' + e.message;
                document.getElementById('data').innerHTML = '<pre>' + e.stack + '</pre>';
                console.error(e);
            }
        }

        test();
    </script>
</body>

</html>
